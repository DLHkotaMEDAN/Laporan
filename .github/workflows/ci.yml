name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: ./artifacts/laporan-kerja
        run: pnpm typecheck

      - name: Run tests
        working-directory: ./artifacts/laporan-kerja
        run: pnpm test:run

      - name: Install Playwright browsers
        working-directory: ./artifacts/laporan-kerja
        run: pnpm exec playwright install --with-deps chromium

      - name: Start dev server
        working-directory: ./artifacts/laporan-kerja
        run: pnpm dev &
        shell: bash

      - name: Wait for dev server
        run: |
          timeout 60 bash -c 'until curl -s http://localhost:5173 > /dev/null; do sleep 2; done' || exit 1
        shell: bash

      - name: Run E2E tests
        working-directory: ./artifacts/laporan-kerja
        run: pnpm test:e2e

      - name: Build
        working-directory: ./artifacts/laporan-kerja
        run: pnpm build

  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: ./artifacts/api-server
        run: pnpm typecheck

      - name: Build
        working-directory: ./artifacts/api-server
        run: pnpm build
