name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: ./artifacts/laporan-kerja
        run: pnpm typecheck

      - name: Run tests
        working-directory: ./artifacts/laporan-kerja
        run: pnpm test:run

      # E2E tests skipped in CI - run manually in local development
      # E2E tests require browser and dev server which are complex to setup in CI

      - name: Build
        working-directory: ./artifacts/laporan-kerja
        run: pnpm build

  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: ./artifacts/api-server
        run: pnpm typecheck

      - name: Build
        working-directory: ./artifacts/api-server
        run: pnpm build
