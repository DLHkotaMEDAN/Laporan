openapi: 3.0.3
info:
  title: Laporan App API
  description: API untuk Sistem Laporan Dinas Lingkungan Hidup Kota Medan
  version: 1.0.0
  contact:
    name: DLH Kota Medan
    email: support@dlh-medan.go.id

servers:
  - url: https://laporan.dlh-medan.go.id/api
    description: Production server
  - url: https://staging-laporan.dlh-medan.go.id/api
    description: Staging server
  - url: http://localhost:3000/api
    description: Local development server

tags:
  - name: Authentication
    description: User authentication and session management
  - name: Reports
    description: Daily, weekly, and monthly report management
  - name: Work Plans
    description: Work plan management
  - name: Fuel (BBM)
    description: Fuel usage reporting
  - name: SPJ Oli
    description: Oil usage reporting
  - name: PDF
    description: PDF generation endpoints
  - name: Users
    description: User management

paths:
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      description: Authenticate user with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: password123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    type: object
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
        '400':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '429':
          description: Too many attempts (rate limited)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  retryAfter:
                    type: integer

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      description: End user session
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
        '401':
          description: Unauthorized

  /reports:
    get:
      tags:
        - Reports
      summary: Get all reports
      description: Retrieve all reports with optional filtering
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: regionId
          in: query
          schema:
            type: string
        - name: teamId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Report'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (insufficient permissions)

    post:
      tags:
        - Reports
      summary: Create report
      description: Create a new report
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportInput'
      responses:
        '201':
          description: Report created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /reports/{id}:
    get:
      tags:
        - Reports
      summary: Get report by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Report details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '404':
          description: Report not found

    put:
      tags:
        - Reports
      summary: Update report
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportInput'
      responses:
        '200':
          description: Report updated
        '404':
          description: Report not found

    delete:
      tags:
        - Reports
      summary: Delete report
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Report deleted
        '404':
          description: Report not found

  /work-plans:
    get:
      tags:
        - Work Plans
      summary: Get all work plans
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: List of work plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkPlan'

    post:
      tags:
        - Work Plans
      summary: Create work plan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkPlanInput'
      responses:
        '201':
          description: Work plan created
        '400':
          description: Invalid input

  /fuel-reports:
    get:
      tags:
        - Fuel (BBM)
      summary: Get fuel reports
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of fuel reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FuelReport'

    post:
      tags:
        - Fuel (BBM)
      summary: Create fuel report
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FuelReportInput'
      responses:
        '201':
          description: Fuel report created

  /spj-oli:
    get:
      tags:
        - SPJ Oli
      summary: Get SPJ Oli reports
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of SPJ Oli reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpjOli'

    post:
      tags:
        - SPJ Oli
      summary: Create SPJ Oli report
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpjOliInput'
      responses:
        '201':
          description: SPJ Oli report created

  /pdf/render:
    post:
      tags:
        - PDF
      summary: Generate PDF
      description: Generate PDF from HTML content
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - html
              properties:
                html:
                  type: string
                  description: HTML content to convert to PDF
                options:
                  type: object
                  properties:
                    format:
                      type: string
                      enum: [A4, Letter]
                      default: A4
                    landscape:
                      type: boolean
                      default: false
      responses:
        '200':
          description: PDF generated
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid input or oversized payload
        '401':
          description: Unauthorized
        '429':
          description: Rate limit exceeded

  /users:
    get:
      tags:
        - Users
      summary: Get all users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

    post:
      tags:
        - Users
      summary: Create user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: User created
        '400':
          description: Invalid input

  /users/{id}:
    put:
      tags:
        - Users
      summary: Update user
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '200':
          description: User updated
        '404':
          description: User not found

    delete:
      tags:
        - Users
      summary: Delete user
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: User deleted
        '404':
          description: User not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from Supabase authentication

  schemas:
    Report:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
          format: date
        category:
          type: string
        tasks:
          type: array
          items:
            type: object
        region_id:
          type: string
        team_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ReportInput:
      type: object
      required:
        - date
        - category
      properties:
        date:
          type: string
          format: date
        category:
          type: string
        tasks:
          type: array
          items:
            type: object
        region_id:
          type: string
        team_id:
          type: string

    WorkPlan:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
          format: date
        category:
          type: string
        tasks:
          type: array
        region_id:
          type: string
        team_id:
          type: string
        created_at:
          type: string
          format: date-time

    WorkPlanInput:
      type: object
      required:
        - date
        - category
      properties:
        date:
          type: string
          format: date
        category:
          type: string
        tasks:
          type: array
        region_id:
          type: string
        team_id:
          type: string

    FuelReport:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
          format: date
        vehicle_operator:
          type: string
        no_pol:
          type: string
        fuel_type:
          type: string
        amount:
          type: number
        amount_liter:
          type: number
        amount_rp:
          type: number
        region_id:
          type: string
        team_id:
          type: string

    FuelReportInput:
      type: object
      required:
        - date
        - fuel_type
      properties:
        date:
          type: string
          format: date
        vehicle_operator:
          type: string
        no_pol:
          type: string
        fuel_type:
          type: string
        amount:
          type: number
        amount_liter:
          type: number
        amount_rp:
          type: number
        region_id:
          type: string
        team_id:
          type: string

    SpjOli:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
          format: date
        spj_number:
          type: string
        oil_name:
          type: string
        quantity:
          type: number
        region_id:
          type: string
        team_id:
          type: string

    SpjOliInput:
      type: object
      required:
        - date
        - oil_name
        - quantity
      properties:
        date:
          type: string
          format: date
        spj_number:
          type: string
        oil_name:
          type: string
        quantity:
          type: number
        region_id:
          type: string
        team_id:
          type: string

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
        roles:
          type: array
          items:
            type: string
        region_id:
          type: string
        team_id:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    UserInput:
      type: object
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
        role:
          type: string
        roles:
          type: array
          items:
            type: string
        region_id:
          type: string
        team_id:
          type: string
        is_active:
          type: boolean
          default: true
